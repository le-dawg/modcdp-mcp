name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Binaries
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Multi-Platform Binaries & Extension Bundles
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          
          # Compile multi-platform binaries
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOARCH=arm64 GOOS=darwin go build -ldflags="${LDFLAGS}" -o dist/modcdp-mcp-darwin-arm64 ./cmd/modcdp-mcp/
          GOARCH=amd64 GOOS=darwin go build -ldflags="${LDFLAGS}" -o dist/modcdp-mcp-darwin-amd64 ./cmd/modcdp-mcp/
          GOARCH=amd64 GOOS=linux  go build -ldflags="${LDFLAGS}" -o dist/modcdp-mcp-linux-amd64  ./cmd/modcdp-mcp/
          GOARCH=arm64 GOOS=linux  go build -ldflags="${LDFLAGS}" -o dist/modcdp-mcp-linux-arm64  ./cmd/modcdp-mcp/
          
          # Build and package extensions
          npm ci
          node scripts/build-extensions.mjs
          tar -czf "dist/modcdp-extensions-${VERSION}.tar.gz" -C "$HOME/.config/modcdp-mcp/extensions" .
          
          # Generate SHA256 checksums
          cd dist
          shasum -a 256 modcdp-mcp-* modcdp-extensions-* > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/modcdp-mcp-darwin-arm64
            dist/modcdp-mcp-darwin-amd64
            dist/modcdp-mcp-linux-amd64
            dist/modcdp-mcp-linux-arm64
            dist/modcdp-extensions-${{ github.ref_name }}.tar.gz
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
