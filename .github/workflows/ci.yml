name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Go Binary
        run: |
          mkdir -p "$HOME/.local/bin" bin
          go build -ldflags="-s -w" -o "$HOME/.local/bin/modcdp-mcp" ./cmd/modcdp-mcp/
          cp "$HOME/.local/bin/modcdp-mcp" bin/modcdp-mcp
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build Standalone Extensions
        run: node scripts/build-extensions.mjs

      - name: Run Go Tests
        run: go test ./... -v

      - name: Run Node Test Suite
        run: npm test
