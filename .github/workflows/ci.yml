name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (Go + Node.js)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Go Tests
        run: go test ./... -v

      - name: Build Standalone Extensions
        run: node scripts/build-extensions.mjs

      - name: Run Node Test Suite
        run: npm test

      - name: Build Binary
        run: go build -o bin/modcdp-mcp ./cmd/modcdp-mcp/
